name: letyar_rates
description: "Letyar Rates - Live USD/MMK and Gold Rates"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/mark.svg

flutter_native_splash:
  color: "#0B1120"

  android: true
  ios: true
  web: false

  android_12:
    color: "#0B1120"
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"
